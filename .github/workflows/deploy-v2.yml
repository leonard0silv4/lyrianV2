name: Deploy V2 (produção)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy-v2.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-v2-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, lyria-v2]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: /cloudclusters/lyria-v2-src

    steps:
      - name: Node.js 22 no PATH do job (não mexe no node do supervisor)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ativar Yarn via corepack (usa a versão fixada em packageManager)
        run: corepack enable

      - name: Snapshot do commit atualmente em produção
        run: echo "OLD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Atualizar código (git fetch + reset --hard; preserva .env, node_modules, dist)
        run: |
          set -euo pipefail
          git fetch --prune origin main
          git checkout --force main
          git reset --hard origin/main
          echo "NEW_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Detectar se backend e/ou frontend mudaram
        id: diff
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only "$OLD_SHA" "$NEW_SHA" || true)"
          echo "Arquivos alterados:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -q '^backend/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -q '^frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Escrever backend/.env a partir do secret
        if: steps.diff.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: /cloudclusters/lyria-v2-src/backend
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: |
          set -euo pipefail
          if [ -z "$BACKEND_ENV" ]; then
            echo "Secret BACKEND_ENV vazio/ausente — mantendo .env já existente no servidor." >&2
          else
            printf '%s' "$BACKEND_ENV" > .env
            chmod 600 .env
          fi

      - name: Instalar dependências do backend
        if: steps.diff.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: /cloudclusters/lyria-v2-src/backend
        run: yarn install --frozen-lockfile

      - name: Instalar dependências e build do frontend
        if: steps.diff.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: /cloudclusters/lyria-v2-src/frontend
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Reiniciar somente o v2-api (nunca o legado, nunca o nginx)
        if: steps.diff.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          supervisorctl restart v2-api
          sleep 3
          supervisorctl status v2-api | grep -q RUNNING
